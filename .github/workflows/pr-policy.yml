name: PR policy

# Egzekwuje metodologię: issue = branch = pull request = merge = zamknięcie zadania = usunięcie brancha.
# Sprawdza, że branch ma nazwę <typ>/<numer-issue>-<opis>, a opis PR zamyka dokładnie to issue.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  pr-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const branch = pr.head.ref;
            const fail = (msg) => core.setFailed(msg);

            const m = branch.match(/^(feature|fix|chore|docs|refactor|test)\/(\d+)-[a-z0-9]+(?:-[a-z0-9]+)*$/);
            if (!m) {
              return fail(
                `Nazwa brancha "${branch}" jest niepoprawna. Użyj <typ>/<numer-issue>-<opis>, ` +
                `np. feature/24-savings-rate (typy: feature, fix, chore, docs, refactor, test).`
              );
            }
            const number = Number(m[2]);

            const body = pr.body || "";
            const closes = new RegExp(`\\b(close[sd]?|fix(e[sd])?|resolve[sd]?)\\s*:?\\s+#${number}\\b`, "i");
            if (!closes.test(body)) {
              return fail(
                `Opis PR musi zawierać "Closes #${number}" (numer z nazwy brancha), żeby merge zamknął zadanie.`
              );
            }

            let issue;
            try {
              ({ data: issue } = await github.rest.issues.get({ ...context.repo, issue_number: number }));
            } catch (e) {
              return fail(`Issue #${number} nie istnieje w tym repozytorium.`);
            }
            if (issue.pull_request) return fail(`#${number} to pull request, a nie issue.`);
            if (issue.state !== "open") return fail(`Issue #${number} jest już zamknięte.`);

            core.info(`OK: ${branch} -> PR #${pr.number} zamknie issue #${number} (${issue.title})`);
