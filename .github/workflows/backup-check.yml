name: Backup check

# Sprawdza na prawdziwym PostgreSQL, ĹĽe skrypty kopii zapasowej dziaĹ‚ajÄ… i kopiÄ™ da siÄ™ odtworzyÄ‡.
on:
  pull_request:
    paths:
      - "ops/**"
      - "migrations/**"
      - ".github/workflows/backup-check.yml"
  schedule:
    - cron: "17 4 * * 1" # co poniedziaĹ‚ek
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup-restore:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wmt
          POSTGRES_PASSWORD: wmt
          POSTGRES_DB: worthmytime
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wmt -d worthmytime"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://wmt:wmt@localhost:5432/worthmytime
      JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Klient PostgreSQL 16 i katalog kopii
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          pg_dump --version
          echo "BACKUP_DIR=$RUNNER_TEMP/backups" >> "$GITHUB_ENV"
      - run: uv sync --frozen
      - name: Migracje (schemat jak na produkcji)
        run: uv run alembic upgrade head
      - name: Dane przykĹ‚adowe
        run: |
          psql "postgresql://wmt:wmt@localhost:5432/worthmytime" -c \
            "INSERT INTO users (id, email, password_hash, currency, hours_per_day, days_per_week, commute_minutes_per_day, work_costs_monthly, rate_mode, created_at) VALUES ('backup-check', 'backup@check.pl', 'x', 'PLN', 8, 5, 0, 0, 'NOMINAL', now())"
      - name: Kopia zapasowa
        run: bash ops/backup.sh
      - name: Test odtworzenia
        run: bash ops/restore-check.sh
      - name: Retencja usuwa tylko stare kopie
        run: |
          touch -d '30 days ago' "$BACKUP_DIR/worthmytime-19990101T000000Z.dump"
          RETENTION_DAYS=14 bash ops/backup.sh
          test ! -e "$BACKUP_DIR/worthmytime-19990101T000000Z.dump"
          test "$(find "$BACKUP_DIR" -name 'worthmytime-*.dump' | wc -l)" -eq 1

