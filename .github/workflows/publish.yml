name: Publish Docker image to GHCR

# main = produkcja (tag: SHA), stage = testy przed produkcją (tag: stage-<SHA>).
# Uruchomienie ręczne (workflow_dispatch) buduje wybraną gałąź z tagiem <gałąź>-<SHA>.
on:
  push:
    branches:
      - main
      - stage
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build-and-push:
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: downcase REPO
        run: |
          echo "REPO=${GITHUB_REPOSITORY,,}" >>${GITHUB_ENV}

      - name: Wybierz tag obrazu
        run: |
          case "$GITHUB_REF_NAME" in
            main)  echo "IMAGE_TAG=${GITHUB_SHA}" >>"${GITHUB_ENV}" ;;
            stage) echo "IMAGE_TAG=stage-${GITHUB_SHA}" >>"${GITHUB_ENV}" ;;
            *)     echo "IMAGE_TAG=${GITHUB_REF_NAME//\//-}-${GITHUB_SHA}" >>"${GITHUB_ENV}" ;;
          esac

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ env.REPO }}:${{ env.IMAGE_TAG }}
