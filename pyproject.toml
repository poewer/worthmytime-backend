[project]
name = "worthmytime-backend"
version = "0.1.0"
description = "WorthMyTime REST API (Sanic)"
requires-python = ">=3.11,<3.14"
dependencies = [
    "sanic>=24.6",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "pyjwt>=2.8",
    "argon2-cffi>=23.1",
    "alembic>=1.20.0",
]

[dependency-groups]
dev = [
    "openapi-spec-validator>=0.9.0",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.16.10",
    "sanic-testing>=24.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["UP042"]

[tool.ruff.lint.per-file-ignores]
# tabela opisów endpointów: długie, opisowe linie
"app/openapi.py" = ["E501"]

[tool.setuptools.packages.find]
include = ["app*"]
